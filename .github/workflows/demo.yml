name: Cartoon to Real Video Demo

on:
  workflow_dispatch: # GitHub UI पर "Run workflow" बटन दबाकर चलाने के लिए

jobs:
  process-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg & OpenCV)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1-mesa-glx

      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless pillow numpy scenedetect torch torchvision --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run Main Pipeline
        run: |
          python main.py --input input.mp4 --output output_4k.mp4

      - name: Upload Output Video
        uses: actions/upload-artifact@v4
        with:
          name: 4K_Real_Converted_Video
          path: output_4k.mp4

